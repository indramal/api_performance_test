name: API Performance Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Install jq
        run: |
          sudo apt-get install -y jq

      - name: Install lscpu and system tools
        run: |
          sudo apt-get install -y util-linux pciutils

      - name: Install Node.js dependencies
        run: |
          # Install Node.js project dependencies
          for dir in nodejs/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "Installing dependencies in $dir"
              cd "$dir"
              npm install --production
              # Build Next.js projects
              if [ -f "next.config.js" ]; then
                npm run build
              fi
              cd ../../
            fi
          done

      - name: Install Bun dependencies
        run: |
          # Install Bun project dependencies
          for dir in bun/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "Installing dependencies in $dir"
              cd "$dir"
              bun install --production
              # Build Next.js projects for Bun
              if [ -f "next.config.js" ]; then
                bun --bun node_modules/next/dist/bin/next build
              fi
              cd ../../
            fi
          done

      - name: Build Rust projects
        run: |
          # Build Axum
          if [ -d "rust/axum" ]; then
            echo "Building Rust Axum project"
            cd rust/axum
            cargo build --release
            cd ../../
          fi

          # Build Actix
          if [ -d "rust/actix" ]; then
            echo "Building Rust Actix project"
            cd rust/actix
            cargo build --release
            cd ../../
          fi

      - name: Build Spring Boot project
        run: |
          if [ -d "kotlin/springboot" ]; then
            echo "Building Spring Boot project"
            cd kotlin/springboot
            chmod +x gradlew
            ./gradlew build -x test --no-daemon
            cd ../../
          fi

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Run benchmarks
        run: |
          bash scripts/run-benchmarks.sh

      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.sha }}
          path: results/performance-report-*.md
          retention-days: 90

      - name: Commit report to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add only the generated reports
          git add results/performance-report-*.md

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "Add performance benchmark report - $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: Display report summary
        if: always()
        run: |
          LATEST_REPORT=$(ls -t results/performance-report-*.md | head -n 1)
          if [ -f "$LATEST_REPORT" ]; then
            echo "=== Performance Report Summary ==="
            head -n 50 "$LATEST_REPORT"
            echo "..."
            echo "Full report uploaded as artifact and committed to repository"
          fi
